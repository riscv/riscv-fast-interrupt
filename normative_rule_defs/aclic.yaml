  # Operation: xijt gains an EHV bit controlling synchronous-exception vectoring.
  - name: xijt_ehv_op
    tags: ["norm:xijt_ehv_op"]

  # Operation: EHV clear leaves synchronous-exception trap behavior unchanged.
  - name: ehv_clear_op
    tags: ["norm:ehv_clear_op"]

  # Operation: EHV set vectors synchronous exceptions to the computed entry.
  - name: ehv_set_op
    tags: ["norm:ehv_set_op"]

  # ==========================================================================
  # Smip / Ssip: interrupt handler push and pop - control bit, automatic
  # context save/restore, late preemption, tail chaining, abort/fault, and the
  # mipopret/sipopret instructions (batch 6)
  # ==========================================================================

  # Operation: this extension does not affect NMIs.
  - name: smip_nmi_op
    tags: ["norm:smip_nmi_op"]

  # --- Controlling the extension behavior ---

  # Operation: xiconfig.xipu set enables automatic interrupt-trap stacking.
  - name: xipu_enable_op
    tags: ["norm:xipu_enable_op"]

  # Operation: xiconfig.xipu clear leaves trap behavior unmodified.
  - name: xipu_disabled_op
    tags: ["norm:xipu_disabled_op"]

  # --- Interrupt trap (push) behavior ---

  # Operation: the ordered push sequence performed before the first handler
  # instruction (conditional sp swap, save x10-x15, adjust sp).
  - name: smip_trap_push_op
    tags: ["norm:smip_trap_push_op"]

  # Size: stack frame is 24 bytes (RV32E), 32 bytes (RV32I), 48 bytes (RV64).
  - name: smip_framesize_sz
    tags: ["norm:smip_framesize_sz"]

  # --- Returns from interrupt handlers ---

  # Operation: xipopret restores the saved context and returns (ordered pop
  # sequence).
  - name: smip_ipopret_op
    tags: ["norm:smip_ipopret_op"]

  # --- Late preemption ---

  # Operation: an implementation may check for higher-priority interrupts during
  # the trap side effects and switch to that handler.
  - name: smip_late_preempt_op
    tags: ["norm:smip_late_preempt_op"]

  # --- Tail chaining ---

  # Operation: xipopret may be aborted to tail-chain into a pending-and-enabled
  # interrupt (with xepc/xistatus unchanged).
  - name: smip_tailchain_op
    tags: ["norm:smip_tailchain_op"]

  # --- Aborting interrupt traps ---

  # Operation: the interrupt-trap-abort requirements apply to this extension.
  - name: smip_abort_ref_op
    tags: ["norm:smip_abort_ref_op"]

  # Operation: aborted-trap stores may update idempotent memory; non-idempotent
  # regions must not have been updated.
  - name: smip_abort_mem_op
    tags: ["norm:smip_abort_mem_op"]

  # --- Interrupt fault handling ---

  # Operation: store faults during the trap abort it and take a precise
  # interrupt fault trap.
  - name: smip_fault_op
    tags: ["norm:smip_fault_op"]

