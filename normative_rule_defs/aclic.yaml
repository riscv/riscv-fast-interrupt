  - name: mipopret_mode
    tags: ["norm:mipopret_mode"]
    kind: instruction
    instance: mipopret

  # Operation: pop interrupt context and return at machine level.
  - name: mipopret_op
    tags: ["norm:mipopret_op"]
    kind: instruction
    instance: mipopret

