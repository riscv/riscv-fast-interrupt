  # Encoding of the sipopret instruction.
  - name: sipopret_enc
    tags: ["norm:sipopret_enc"]
    kind: instruction
    instance: sipopret

  # Privilege mode: below supervisor level raises illegal instruction.
  - name: sipopret_mode
    tags: ["norm:sipopret_mode"]
